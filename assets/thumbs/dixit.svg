<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a4a"/>
      <stop offset="1" stop-color="#1c1428"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>

  <!-- dreamy storyteller moon/clouds -->
  <circle cx="330" cy="52" r="24" fill="#e8d8a0" opacity="0.9"/>
  <ellipse cx="120" cy="52" rx="70" ry="14" fill="#8a9ad0" opacity="0.5"/>
  <ellipse cx="200" cy="40" rx="50" ry="12" fill="#8a9ad0" opacity="0.4"/>

  <!-- storyteller card (the chosen clue card) -->
  <g transform="rotate(-6 120 150)">
    <rect x="60" y="90" width="120" height="170" rx="9" fill="#eef2f7" stroke="#c9a4d0" stroke-width="2.5"/>
    <rect x="60" y="90" width="120" height="30" rx="9" fill="#8a5ab8"/>
    <text x="120" y="113" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">Storyteller</text>
    <text x="120" y="205" text-anchor="middle" font-size="60">🦋</text>
    <circle cx="92" cy="170" r="8" fill="#e8c34d" opacity="0.9"/>
    <circle cx="148" cy="176" r="6" fill="#d9a05b" opacity="0.9"/>
  </g>

  <!-- guessing hand cards -->
  <g transform="rotate(7 260 160)">
    <rect x="214" y="104" width="92" height="128" rx="8" fill="#eef2f7" stroke="#9db4d8" stroke-width="1.5"/>
    <rect x="214" y="104" width="92" height="24" rx="8" fill="#5a9ad0"/>
    <text x="260" y="200" text-anchor="middle" font-size="42">🦉</text>
  </g>
  <g transform="rotate(12 306 170)">
    <rect x="262" y="116" width="88" height="122" rx="8" fill="#eef2f7" stroke="#9db4d8" stroke-width="1.5"/>
    <rect x="262" y="116" width="88" height="24" rx="8" fill="#d98a5a"/>
    <text x="306" y="206" text-anchor="middle" font-size="42">🌙</text>
  </g>

  <!-- score token / votes -->
  <g>
    <circle cx="210" cy="60" r="13" fill="#e8c34d" stroke="#a87b1a" stroke-width="2"/>
    <text x="210" y="65" text-anchor="middle" font-size="13" fill="#7a5200">3</text>
    <circle cx="246" cy="72" r="11" fill="#d64545" stroke="#8f2c2c" stroke-width="2"/>
    <text x="246" y="76" text-anchor="middle" font-size="10" fill="#fff">1</text>
  </g>
</svg>