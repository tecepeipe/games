<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0d0d1c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>

  <!-- coin pile -->
  <g>
    <circle cx="90" cy="200" r="26" fill="#e8c34d" stroke="#a87b1a" stroke-width="3"/>
    <circle cx="90" cy="200" r="16" fill="none" stroke="#b8860b" stroke-width="2"/>
    <text x="90" y="206" text-anchor="middle" font-size="16" fill="#7a5200">¢</text>
  </g>
  <g>
    <circle cx="140" cy="206" r="22" fill="#e8c34d" stroke="#a87b1a" stroke-width="3"/>
    <circle cx="140" cy="206" r="13" fill="none" stroke="#b8860b" stroke-width="2"/>
  </g>
  <g>
    <circle cx="180" cy="198" r="18" fill="#e8c34d" stroke="#a87b1a" stroke-width="3"/>
  </g>

  <!-- victory card (province) -->
  <g transform="rotate(-4 250 120)">
    <rect x="210" y="60" width="80" height="120" rx="8" fill="#eef2f7" stroke="#9db4d8" stroke-width="1.5"/>
    <rect x="210" y="60" width="80" height="26" rx="8" fill="#4d7fd9"/>
    <text x="250" y="80" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">Province</text>
    <rect x="222" y="94" width="56" height="56" rx="6" fill="#e9eef7" stroke="#b9c8e4" stroke-width="1.5"/>
    <text x="250" y="132" text-anchor="middle" font-size="30">👑</text>
    <text x="250" y="172" text-anchor="middle" font-size="15" fill="#6a86b5">6</text>
  </g>

  <!-- estate / kingdom pile -->
  <g transform="rotate(6 330 120)">
    <rect x="292" y="70" width="76" height="114" rx="8" fill="#eef2f7" stroke="#9db4d8" stroke-width="1.5"/>
    <rect x="292" y="70" width="76" height="24" rx="8" fill="#3fae5a"/>
    <text x="330" y="88" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Estate</text>
    <text x="330" y="140" text-anchor="middle" font-size="26">🏰</text>
  </g>

  <!-- small action cards across the top -->
  <g transform="rotate(-3 90 60)">
    <rect x="60" y="34" width="52" height="70" rx="6" fill="#eef2f7" stroke="#9db4d8" stroke-width="1.5"/>
    <text x="86" y="76" text-anchor="middle" font-size="22">⚔️</text>
  </g>
  <g transform="rotate(2 130 50)">
    <rect x="104" y="28" width="52" height="70" rx="6" fill="#eef2f7" stroke="#9db4d8" stroke-width="1.5"/>
    <text x="130" y="70" text-anchor="middle" font-size="22">🔮</text>
  </g>
  <g transform="rotate(4 168 56)">
    <rect x="142" y="32" width="52" height="70" rx="6" fill="#eef2f7" stroke="#9db4d8" stroke-width="1.5"/>
    <text x="168" y="74" text-anchor="middle" font-size="22">🏹</text>
  </g>
</svg>