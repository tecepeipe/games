<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1620"/>
      <stop offset="1" stop-color="#1c0a10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>

  <!-- crown (king role) -->
  <text x="200" y="52" text-anchor="middle" font-size="40">👑</text>

  <!-- character draft cards -->
  <g transform="rotate(-8 80 150)">
    <rect x="36" y="100" width="88" height="140" rx="8" fill="#eef2f7" stroke="#b98a6a" stroke-width="2"/>
    <rect x="36" y="100" width="88" height="26" rx="8" fill="#c0392b"/>
    <text x="80" y="120" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Warlord</text>
    <text x="80" y="190" text-anchor="middle" font-size="40">🗡️</text>
  </g>
  <g transform="rotate(1 130 155)">
    <rect x="86" y="106" width="88" height="140" rx="8" fill="#eef2f7" stroke="#b98a6a" stroke-width="2"/>
    <rect x="86" y="106" width="88" height="26" rx="8" fill="#3f6fb8"/>
    <text x="130" y="126" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Magician</text>
    <text x="130" y="196" text-anchor="middle" font-size="40">🪄</text>
  </g>
  <g transform="rotate(7 180 150)">
    <rect x="136" y="100" width="88" height="140" rx="8" fill="#eef2f7" stroke="#b98a6a" stroke-width="2"/>
    <rect x="136" y="100" width="88" height="26" rx="8" fill="#3fae5a"/>
    <text x="180" y="120" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Architect</text>
    <text x="180" y="190" text-anchor="middle" font-size="40">🏗️</text>
  </g>

  <!-- district cards bottom right -->
  <g transform="rotate(-4 280 190)">
    <rect x="246" y="160" width="62" height="86" rx="7" fill="#eef2f7" stroke="#9db4d8" stroke-width="1.5"/>
    <text x="277" y="214" text-anchor="middle" font-size="28">🏰</text>
  </g>
  <g transform="rotate(5 320 196)">
    <rect x="288" y="166" width="62" height="86" rx="7" fill="#eef2f7" stroke="#9db4d8" stroke-width="1.5"/>
    <text x="319" y="220" text-anchor="middle" font-size="28">⛪</text>
  </g>
  <g transform="rotate(2 300 140)">
    <rect x="270" y="108" width="58" height="80" rx="6" fill="#eef2f7" stroke="#9db4d8" stroke-width="1.5"/>
    <text x="299" y="162" text-anchor="middle" font-size="26">🏛️</text>
  </g>
</svg>