<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1.2">
      <stop offset="0" stop-color="#2a1a4a"/>
      <stop offset="1" stop-color="#0d0a1c"/>
    </radialGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>

  <!-- moon + arcane glow -->
  <circle cx="66" cy="56" r="30" fill="#cfd8ff" opacity="0.9"/>
  <circle cx="76" cy="48" r="28" fill="#2a1a4a"/>
  <circle cx="200" cy="60" r="120" fill="#7a5bd9" opacity="0.08"/>

  <!-- investigator card -->
  <g transform="rotate(-5 110 150)">
    <rect x="60" y="92" width="100" height="150" rx="9" fill="#eef2f7" stroke="#b9a4e0" stroke-width="2"/>
    <rect x="60" y="92" width="100" height="30" rx="9" fill="#6a4fc4"/>
    <text x="110" y="113" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Roland</text>
    <text x="110" y="190" text-anchor="middle" font-size="40">🕵️</text>
    <text x="110" y="232" text-anchor="middle" font-size="12" fill="#6a86b5">❤9 🕯5</text>
  </g>

  <!-- monster enemy card -->
  <g transform="rotate(6 300 160)">
    <rect x="248" y="100" width="104" height="150" rx="9" fill="#3a1430" stroke="#b4456a" stroke-width="2"/>
    <rect x="248" y="100" width="104" height="28" rx="9" fill="#b4456a"/>
    <text x="300" y="121" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Ghoul</text>
    <text x="300" y="190" text-anchor="middle" font-size="42">👹</text>
    <text x="300" y="236" text-anchor="middle" font-size="12" fill="#f0c0d4">⚔2 · ✚4</text>
  </g>

  <!-- chaos tokens -->
  <g>
    <circle cx="120" cy="48" r="14" fill="#3a3a5a" stroke="#8a8ac0" stroke-width="2"/>
    <text x="120" y="53" text-anchor="middle" font-size="13" fill="#cfd8ff">-2</text>
    <circle cx="160" cy="60" r="14" fill="#4a1a1a" stroke="#b4456a" stroke-width="2"/>
    <text x="160" y="65" text-anchor="middle" font-size="13">☠</text>
    <circle cx="46" cy="96" r="13" fill="#3a3a5a" stroke="#8a8ac0" stroke-width="2"/>
    <text x="46" y="101" text-anchor="middle" font-size="12" fill="#cfd8ff">+1</text>
    <circle cx="340" cy="52" r="13" fill="#3a1a3a" stroke="#a06ac0" stroke-width="2"/>
    <text x="340" y="57" text-anchor="middle" font-size="12" fill="#e0c8ff">◆</text>
  </g>
</svg>